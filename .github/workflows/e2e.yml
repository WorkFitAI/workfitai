name: E2E Tests (Manual)

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project to run (leave blank for all role-based projects)'
        required: false
        default: ''

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          if [ -n "${{ github.event.inputs.project }}" ]; then
            npx playwright test --project="${{ github.event.inputs.project }}"
          else
            npx playwright test
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
